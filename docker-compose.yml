# Example: shared YASD cache for multi-replica Echo (Socket.IO scaling).
# The multi-stage Dockerfile builds TypeScript inside the image; no local
# dist/ directory is required. Run:
#   docker compose up --build
services:
  yasd:
    build: .
    container_name: yasd
    ports:
      # Single port serves RESP plus /livez, /readyz, and /healthz
      - "127.0.0.1:7379:7379"
    environment:
      YASD_PORT: "7379"
      YASD_HOST: "0.0.0.0"
      YASD_SNAPSHOT: "/data/snapshot.json"
      YASD_AOF: "/data/appendonly.aof"
      YASD_AUTO_SAVE_MS: "60000"
      CACHE_MAX_ENTRIES: "50000"
      CACHE_MAX_BYTES: "268435456" # 256 MiB
      # Per-namespace TTL defaults (ms): feeds 15s, popular 60s, channels 30s
      CACHE_NAMESPACE_TTLS: '{"feeds":15000,"popular":60000,"channels":30000,"presence":30000,"typing":10000}'
      # Optional RESP auth/TLS. Mount certificates before enabling these.
      # YASD_PASSWORD: "change-me"
      # YASD_TLS_KEY: "/run/secrets/yasd-server.key"
      # YASD_TLS_CERT: "/run/secrets/yasd-server.crt"
      # YASD_TLS_CA: "/run/secrets/yasd-ca.crt"
      # YASD_TLS_REQUEST_CERT: "true"
      # YASD_TLS_REJECT_UNAUTHORIZED: "true"
      # TLS healthcheck verification for a private CA or mTLS:
      # YASD_HEALTHCHECK_CA: "/run/secrets/yasd-health-ca.crt"
      # YASD_HEALTHCHECK_SERVERNAME: "yasd.internal"
      # YASD_HEALTHCHECK_CLIENT_CERT: "/run/secrets/yasd-health-client.crt"
      # YASD_HEALTHCHECK_CLIENT_KEY: "/run/secrets/yasd-health-client.key"
    volumes:
      - yasd-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Keep memory above CACHE_MAX_BYTES for Node/V8, sockets, and snapshots.
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Example Echo API replica wiring (illustrative — replace with the real
  # Echo server image). Every replica shares the cache via CACHE_URL:
  #
  # echo-api:
  #   image: echo-server:latest
  #   depends_on:
  #     yasd:
  #       condition: service_healthy
  #   environment:
  #     CACHE_URL: "yasd://yasd:7379?poolSize=8"
  #   deploy:
  #     replicas: 3

volumes:
  yasd-data:
